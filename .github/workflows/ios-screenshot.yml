# 시뮬레이터에서 앱을 실제 실행해 스크린샷 캡처(정적). CI(macOS)에서만 가능.
name: iOS Screenshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ios-screenshot.yml"
      - "TAS/**"
      - "TASTests/Fixtures/**"   # 게스트 시드가 바뀌면 스크린샷도 다시 찍는다

jobs:
  screenshot:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project TAS.xcodeproj -scheme TAS \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -20

      - name: Boot a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); devs=[x for v in d['devices'].values() for x in v if 'iPhone' in x['name']]; print(devs[0]['udid'])")
          echo "Using device $DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Install app
        run: |
          APP=$(find build/Build/Products -name "TAS.app" -type d | head -1)
          echo "App: $APP"
          xcrun simctl install "$DEVICE" "$APP"

      # 앱을 그냥 띄우면 로그인 화면만 잡힌다. 게스트 스냅샷을 미리 심어두면
      # SessionStore.restore가 hasOnboardedData를 보고 바로 캘린더로 들어간다.
      # 시드 스키마는 GuestSeedTests가 지킨다 — LocalStore.load는 디코딩 실패를
      # 조용히 삼키므로(nil → 로그인 화면) 여기서 어긋나면 알 길이 없다.
      - name: Seed guest snapshot
        run: |
          TODAY=$(python3 -c "import datetime;print((datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(hours=9)).strftime('%Y-%m-%d'))")
          echo "KST today: $TODAY"

          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" kr.co.takeaseat.app data)
          DOCS="$CONTAINER/Documents"
          mkdir -p "$DOCS"

          sed "s/__TODAY__/$TODAY/g" TASTests/Fixtures/guest-seed.json \
            > "$DOCS/takeaseat.local-db.v1.json"

          test -s "$DOCS/takeaseat.local-db.v1.json"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$DOCS/takeaseat.local-db.v1.json"
          echo "Seeded: $DOCS/takeaseat.local-db.v1.json"

      - name: Launch app
        run: |
          xcrun simctl launch "$DEVICE" kr.co.takeaseat.app || true
          sleep 10

      - name: Capture screenshot
        run: |
          xcrun simctl io "$DEVICE" screenshot screen.png
          sips -Z 1000 screen.png || true
          ls -la screen.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: screen.png
          if-no-files-found: error

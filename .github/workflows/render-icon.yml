# 로그인 화면의 그 의자(SF 심볼 chair.lounge.fill)를 macOS AppKit으로 PNG 렌더링.
name: Render App Icon

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-icon.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/tas-service-ios-stlzh4

      - name: Render icon from SF Symbol (AppKit)
        run: |
          cat > render.swift <<'SWIFT'
          import AppKit
          import Foundation

          let px = 1024

          // RGBA(알파 포함) 비트맵 — NSGraphicsContext가 backing 가능한 유일한 포맷
          guard let rep = NSBitmapImageRep(
              bitmapDataPlanes: nil, pixelsWide: px, pixelsHigh: px,
              bitsPerSample: 8, samplesPerPixel: 4, hasAlpha: true, isPlanar: false,
              colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0) else {
              print("no rep"); exit(1)
          }
          guard let ctx = NSGraphicsContext(bitmapImageRep: rep) else { print("no ctx"); exit(1) }
          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = ctx
          let cg = ctx.cgContext

          // 브랜드 퍼플 그라디언트(위 밝고 아래 어둡게)
          let cs = CGColorSpaceCreateDeviceRGB()
          let colors = [CGColor(red: 120/255, green: 62/255, blue: 226/255, alpha: 1),
                        CGColor(red: 68/255, green: 20/255, blue: 150/255, alpha: 1)] as CFArray
          guard let grad = CGGradient(colorsSpace: cs, colors: colors, locations: [0, 1]) else {
              print("no grad"); exit(1)
          }
          cg.drawLinearGradient(grad, start: CGPoint(x: 0, y: px), end: CGPoint(x: 0, y: 0), options: [])

          // SF 심볼 → 흰색 틴트
          let cfg = NSImage.SymbolConfiguration(pointSize: 620, weight: .regular)
          guard let base = NSImage(systemSymbolName: "chair.lounge.fill", accessibilityDescription: nil),
                let sym = base.withSymbolConfiguration(cfg) else { print("no symbol"); exit(1) }
          sym.isTemplate = true
          let symRect = NSRect(origin: .zero, size: sym.size)
          let tinted = NSImage(size: sym.size)
          tinted.lockFocus()
          sym.draw(at: .zero, from: symRect, operation: .sourceOver, fraction: 1)
          NSColor.white.set()
          symRect.fill(using: .sourceAtop)
          tinted.unlockFocus()
          print("symbol size \(sym.size)")

          // 중앙에 560pt로 배치
          let target: CGFloat = 560
          let scale = target / max(sym.size.width, sym.size.height)
          let dw = sym.size.width * scale, dh = sym.size.height * scale
          tinted.draw(in: NSRect(x: (CGFloat(px)-dw)/2, y: (CGFloat(px)-dh)/2, width: dw, height: dh),
                      from: symRect, operation: .sourceOver, fraction: 1)

          NSGraphicsContext.restoreGraphicsState()
          guard let png = rep.representation(using: .png, properties: [:]) else { print("no png"); exit(1) }
          try! png.write(to: URL(fileURLWithPath: "TAS/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"))
          print("rendered ok")
          SWIFT
          swift render.swift

      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TAS/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          git commit -m "Render app icon from chair.lounge.fill SF Symbol (AppKit)" || { echo "no change"; exit 0; }
          git push origin claude/tas-service-ios-stlzh4

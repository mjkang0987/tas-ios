# TestFlight 자동 업로드.
# 실행 방법 2가지:
#   1) 수동: Actions → TestFlight Upload → Run workflow
#   2) 자동: main에 push된 커밋 메시지에 [tf] 가 있을 때 (예: "게스트 CRUD 완료 [tf]")
#      → 매 push마다 올리지 않고, [tf] 표시한 커밋만 업로드해 빌드 폭주를 막는다.
# App Store Connect API 키(클라우드 서명)로 아카이브·서명·업로드까지 자동화.
# 필요한 GitHub Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, ASC_TEAM_ID
# (설정 방법은 docs/TESTFLIGHT.md 참고. 시크릿이 없으면 초반에 실패하고 안내한다.)
name: TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "표시 버전(CFBundleShortVersionString). 비우면 프로젝트 설정값 사용."
        required: false
        default: ""
  push:
    branches: [main]

jobs:
  upload:
    runs-on: macos-latest
    # 수동 실행은 항상, push는 커밋 메시지에 [tf]가 있을 때만 업로드.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tf]')
    steps:
      # ref를 고정하지 않는다. 기본값(트리거한 커밋 / 수동 실행 시 고른 브랜치의 HEAD)을 쓴다.
      # 예전엔 특정 feature 브랜치가 박혀 있어서, main이 29커밋 앞서간 뒤에도 수동 실행이
      # 그 옛 브랜치를 올렸다. 무엇이 올라가는지 실행 화면에서 보이지 않는 게 특히 나빴다.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8_BASE64" ] && missing="$missing ASC_KEY_P8_BASE64"
          [ -z "$ASC_TEAM_ID" ] && missing="$missing ASC_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::누락된 시크릿:$missing — docs/TESTFLIGHT.md 참고해서 등록해줘."
            exit 1
          fi
          echo "시크릿 확인 완료."

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive (unsigned — 배포 서명은 export에서)
        env:
          MARKETING_VERSION_INPUT: ${{ github.event.inputs.marketing_version }}
        run: |
          # 빌드 번호는 GitHub run number로 → 업로드마다 유일(규약: TestFlight마다 +1).
          VERSION_ARGS="CURRENT_PROJECT_VERSION=${{ github.run_number }}"
          if [ -n "$MARKETING_VERSION_INPUT" ]; then
            VERSION_ARGS="$VERSION_ARGS MARKETING_VERSION=$MARKETING_VERSION_INPUT"
          fi
          # 아카이브는 서명하지 않는다(개발용 프로파일 생성 시도를 피함 — 기기 등록 불필요).
          # 배포용(App Store) 서명은 -exportArchive 단계에서 API 키로 클라우드 처리한다.
          xcodebuild archive \
            -project TAS.xcodeproj -scheme TAS -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TAS.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            $VERSION_ARGS | tail -40

      - name: Export .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${ASC_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/TAS.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "IPA_PATH=$(find build/export -name '*.ipa' | head -1)" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "Uploading $IPA_PATH (ref: ${{ github.ref_name }} / ${{ github.sha }}) ..."
          xcrun altool --upload-app --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "업로드 완료 — App Store Connect에서 처리(10~30분) 후 TestFlight에 노출됩니다."

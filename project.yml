# XcodeGen spec — optional. Regenerate TAS.xcodeproj with:
#   brew install xcodegen && xcodegen generate
# The committed TAS.xcodeproj already works; this is here for reproducible regen.
name: TAS
options:
  bundleIdPrefix: com.takeaseat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.0"   # 표시 버전 — 머지 시 semver 범프
    CURRENT_PROJECT_VERSION: "1" # 빌드 번호 — TestFlight 업로드마다 +1
targets:
  TAS:
    type: application
    platform: iOS
    sources:
      - TAS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takeaseat.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TAS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        # Default backend is production (https://takeaseat.co.kr, see AppConfig).
        # For dev/local, override without code changes:
        # INFOPLIST_KEY_TAS_API_BASE_URL: https://dev.takeaseat.co.kr
        # INFOPLIST_KEY_TAS_API_BASE_URL: http://localhost:3000

# XcodeGen spec — optional. Regenerate TAS.xcodeproj with:
#   brew install xcodegen && xcodegen generate
# The committed TAS.xcodeproj already works; this is here for reproducible regen.
name: TAS
options:
  bundleIdPrefix: kr.co.takeaseat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"   # 표시 버전 — 머지 시 semver 범프
    CURRENT_PROJECT_VERSION: "1" # 빌드 번호 — TestFlight 업로드마다 +1
packages:
  # 네이티브 Google 로그인(GoogleSignInManager). iOS 클라이언트 ID(Info.plist GIDClientID)가
  # 설정돼 있을 때만 네이티브로 동작하고, 없으면 웹 위임(ASWebAuth)으로 폴백한다.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 7.1.0
targets:
  TAS:
    type: application
    platform: iOS
    sources:
      - TAS
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.takeaseat.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TAS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        # Default backend is production (https://takeaseat.co.kr, see AppConfig).
        # For dev/local, override without code changes:
        # INFOPLIST_KEY_TAS_API_BASE_URL: https://dev.takeaseat.co.kr
        # INFOPLIST_KEY_TAS_API_BASE_URL: http://localhost:3000
  # 유닛 테스트(호스티드) — @testable import TAS로 순수 로직 검증. CI: ios-test.yml.
  TASTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TASTests
    dependencies:
      - target: TAS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.takeaseat.appTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TAS.app/TAS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  TAS:
    build:
      targets:
        TAS: all
    test:
      targets:
        - TASTests
    run: {}

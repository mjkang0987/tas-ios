# XcodeGen spec — optional. Regenerate TAS.xcodeproj with:
#   brew install xcodegen && xcodegen generate
# The committed TAS.xcodeproj already works; this is here for reproducible regen.
name: TAS
options:
  bundleIdPrefix: com.takeaseat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TAS:
    type: application
    platform: iOS
    sources:
      - TAS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takeaseat.ios
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Point the client at your takeaseat backend during development:
        # INFOPLIST_KEY_TAS_API_BASE_URL: http://localhost:3000
